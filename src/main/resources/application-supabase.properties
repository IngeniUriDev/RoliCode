# En tu panel de Supabase -> Connect -> JDBC, copia tu URL, usuario y contraseña:
spring.datasource.url=jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.tu_id_proyecto_supabase
