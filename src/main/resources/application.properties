spring.application.name=portafolio-web

# 1. Base de Datos SQL guardada en disco duro (en la carpeta ./datos/portafolio_db)
# Gracias a "file:", tus productos, ventas y clientes NO se borran al apagar el servidor.
spring.datasource.url=jdbc:h2:file:./datos/portafolio_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. "update" le dice a Spring Boot: "Si la tabla no existe, créala; si ya existe, conserva los datos".
spring.jpa.hibernate.ddl-auto=update

# 3. Activa el panel visual de Base de Datos en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 4. Lee tus cambios de HTML/CSS/JS en vivo directamente desde tu carpeta de código fuente:
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/

