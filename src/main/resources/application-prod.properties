# =====================================================================
# PERFIL DE PRODUCCIÓN CLOUD (RAILWAY / RENDER / KOYEB + SUPABASE)
# =====================================================================
# Lee el puerto dinámico que asigna el servidor en la nube (o 8080 por defecto)
server.port=${PORT:8080}

# Lee las credenciales de Supabase desde VARIABLES DE ENTORNO seguras (nunca se suben a GitHub)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mantiene tus tablas de Supabase sincronizadas sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
